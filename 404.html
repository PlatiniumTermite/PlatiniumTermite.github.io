<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Flow</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/Flow.png" />
    <link rel="stylesheet" href="/assets/page.css" />
    <style>
      .nf { text-align: center; padding: 110px 0 80px; }
      .nf .big {
        font-size: clamp(80px, 16vw, 140px);
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 1;
        background: linear-gradient(120deg, #0674ed, #7ab8ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .nf p { color: var(--muted); font-size: 17px; margin: 16px 0 30px; }
      .nf a.btn {
        display: inline-block;
        background: var(--blue);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        border-radius: 999px;
        padding: 13px 30px;
      }
    </style>
  </head>
  <body>
    <header class="site-head">
      <div class="in">
        <a class="logo" href="/"><img src="/Flow.png" alt="Flow logo" />Flow</a>
        <nav>
          <a class="cta" href="/download/">Download</a>
        </nav>
      </div>
    </header>
    <main class="wrap nf">
      <div class="big">404</div>
      <h1>That page drifted out of range.</h1>
      <p>The page you wanted isn't here — but your downloads are.</p>
      <a class="btn" href="/">Back to Flow</a>
    </main>
    <footer class="site-foot">
      <div class="wrap">
        <div class="links">
          <a href="/">Home</a>
          <a href="/download/">Download</a>
          <a href="/how-it-works/">How it works</a>
          <a href="/help/">Help</a>
        </div>
      </div>
    </footer>
  </body>
</html>
